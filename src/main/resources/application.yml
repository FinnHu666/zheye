spring:
  application:
    name: finns
  datasource:
    url: jdbc:h2:file:./data/aitome;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false
  web:
    resources:
      cache:
        period: 1h
server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
      timeout: 7d
management:
  endpoints:
    web:
      exposure:
        include: health
finns:
  access:
    # 首位管理员：启动时若没有任何能管理角色的用户，把该邮箱对应的账户设为管理员（FINNS-11）
    bootstrap-admin-email: ${FINNS_BOOTSTRAP_ADMIN_EMAIL:}
    # 操作记录按日期筛选时使用的时区
    audit-zone: ${FINNS_AUDIT_ZONE:Asia/Shanghai}
