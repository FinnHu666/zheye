spring:
  application:
    name: finns
  datasource:
    url: jdbc:h2:file:./data/aitome;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false
  web:
    resources:
      cache:
        period: 1h
server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
      timeout: 7d
management:
  endpoints:
    web:
      exposure:
        include: health
finns:
  access:
    # 首位管理员：启动时若没有任何能管理角色的用户，把该邮箱对应的账户设为管理员（FINNS-11）
    bootstrap-admin-email: ${FINNS_BOOTSTRAP_ADMIN_EMAIL:}
    # 操作记录按日期筛选时使用的时区
    audit-zone: ${FINNS_AUDIT_ZONE:Asia/Shanghai}
  # 账号邮件（FINNS-15）：默认 disabled——不发信也不记录链接，新账号创建不可用；凭据只来自环境变量。
  public-base-url: ${FINNS_PUBLIC_BASE_URL:}
  mail:
    mode: ${FINNS_MAIL_MODE:disabled}   # disabled | smtp | outbox（outbox 仅本机开发，需 server.address=127.0.0.1）
    host: ${FINNS_MAIL_HOST:}
    port: ${FINNS_MAIL_PORT:587}
    username: ${FINNS_MAIL_USERNAME:}
    password: ${FINNS_MAIL_PASSWORD:}
    from: ${FINNS_MAIL_FROM:}
    starttls: ${FINNS_MAIL_STARTTLS:true}
    ssl: ${FINNS_MAIL_SSL:false}            # 隐式 TLS（465）；为 true 时忽略 starttls
    daily-budget: ${FINNS_MAIL_DAILY_BUDGET:0}   # 全局日发送预算，建议服务商日额度的 80%；0 表示不限制
    async: true
